# Chạy: docker compose --env-file .env.production up -d --build
# (--env-file bắt buộc — compose dùng biến trong file đó để điền cả vào phần "environment:" dưới
# đây lẫn thay thế ${...} ngay trong file này. Copy từ .env.production.example trước, xem
# docs/TRIEN_KHAI.md.)
services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
      # CHỈ mount schema.sql (DDL thuần, KHÔNG dữ liệu) — KHÔNG mount seed.sql hay cả thư mục
      # server/db/: mount cả thư mục sẽ khiến MySQL image tự chạy MỌI *.sql/*.sh nằm trực tiếp trong
      # đó ở lần khởi tạo đầu tiên (volume db_data rỗng), tức là seed.sql (3 tài khoản demo + dữ liệu
      # mẫu) SẼ tự chạy vào production — không được phép (xem docs/TRIEN_KHAI.md). Sau khi DB khởi
      # tạo từ schema.sql, PHẢI chạy đúng 1 lần: `docker compose exec app npm run admin:create` (tạo
      # settings mặc định + baseline schema_migrations + Admin đầu tiên từ ADMIN_EMAIL/ADMIN_PASSWORD
      # — xem server/scripts/createAdmin.js).
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      CLIENT_URL: ${CLIENT_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      APP_TIMEZONE: ${APP_TIMEZONE}
      DEBUG_ERRORS: ${DEBUG_ERRORS}
      MAIL_ENABLED: ${MAIL_ENABLED}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      REMINDER_JOB_ENABLED: ${REMINDER_JOB_ENABLED}
      # Số hop reverse proxy phía trước (Nginx...) — 1 nếu dùng đúng theo hướng dẫn
      # docs/TRIEN_KHAI.md (1 Nginx duy nhất đứng trước app). Để trống nếu không qua proxy nào.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS}
      # Dùng 1 lần bởi `docker compose exec app npm run admin:create` (server/scripts/createAdmin.js)
      # — KHÔNG phải tài khoản demo, không có UI nào tự tạo tài khoản Admin đầu tiên khi không seed.
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME}
    ports:
      - '5000:5000'
    volumes:
      # Giữ lại file báo cáo đã upload qua các lần recreate container (server/config/upload.js tự
      # tạo lại thư mục con nếu chưa có, không cần mkdir tay).
      - server_uploads:/app/server/uploads

volumes:
  db_data:
  server_uploads:
